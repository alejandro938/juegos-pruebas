<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1a33">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<title>El Seis de la Suerte · Stela Mare</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1a33;--night2:#132a4f;--gold:#e8c26a;--gold2:#c9a45c;--red:#d63a3a;--green:#1f8a4c;--snow:#f8fafc;--mute:#9fb0c9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--snow);background:radial-gradient(ellipse at top,#1b3a6b 0%,var(--night) 60%);min-height:100dvh;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px 18px 22px;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top a,.top button{color:var(--mute);font:600 13px Inter;text-decoration:none;background:none;border:0;cursor:pointer}
.top select{background:transparent;color:var(--mute);border:1px solid #2c4670;border-radius:6px;font:600 12px Inter;padding:3px}
.top select option{color:#000}
h1{font-family:'Playfair Display',serif;font-weight:900;text-align:center;font-size:32px;color:var(--gold);margin:14px 0 2px;text-shadow:0 2px 18px rgba(232,194,106,.35)}
.sub{text-align:center;color:var(--mute);font-size:13px;line-height:1.45;margin-bottom:16px}
.panel{background:rgba(255,255,255,.06);border:1px solid rgba(232,194,106,.25);border-radius:18px;padding:14px}
.lbl{font:700 11px Inter;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:block}
.add{display:flex;gap:8px}
.add input{flex:1;background:rgba(255,255,255,.08);border:1px solid #2c4670;border-radius:10px;color:var(--snow);font:500 15px Inter;padding:11px 12px;outline:none}
.add input:focus{border-color:var(--gold)}
.btn{border:0;border-radius:12px;font:800 15px Inter;padding:12px 16px;cursor:pointer;background:var(--gold);color:var(--night)}
.btn.big{width:100%;padding:17px;font-size:18px;margin-top:14px;box-shadow:0 6px 22px rgba(232,194,106,.35)}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold2)}
.players{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pl{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid transparent;transition:all .25s}
.pl.now{border-color:var(--gold);background:rgba(232,194,106,.14);transform:scale(1.02)}
.pl .nm{flex:1;font-weight:700}
.pl .gifts{font-weight:900;color:var(--gold);font-size:17px;min-width:44px;text-align:right}
.pl .x{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer}
.turn{text-align:center;font:900 26px 'Playfair Display',serif;margin:6px 0 0;min-height:36px}
.msg{text-align:center;color:var(--mute);font-size:14px;min-height:20px;margin-top:4px}
.stage{display:flex;justify-content:center;margin:18px 0 6px}
.scene{--d:180px;--h:90px;width:var(--d);height:var(--d);perspective:800px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(25deg);transition:transform 1.6s cubic-bezier(.15,.7,.25,1)}
.cube.bounce{animation:bounce 1.6s ease-out}
@keyframes bounce{0%{translate:0 0}20%{translate:0 -50px}45%{translate:0 0}60%{translate:0 -16px}75%{translate:0 0}}
.f{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#e8edf5);border:1px solid #cbd5e1;border-radius:28px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:24px;box-shadow:inset 0 0 18px rgba(15,23,42,.15)}
.f i{width:30px;height:30px;border-radius:50%;background:#0f172a;place-self:center;box-shadow:inset 0 3px 4px rgba(0,0,0,.5)}
.f6 i{background:var(--red)}
.f1{transform:translateZ(var(--h))}.f6{transform:rotateY(180deg) translateZ(var(--h))}
.f2{transform:rotateY(90deg) translateZ(var(--h))}.f5{transform:rotateY(-90deg) translateZ(var(--h))}
.f3{transform:rotateX(90deg) translateZ(var(--h))}.f4{transform:rotateX(-90deg) translateZ(var(--h))}
.log{margin-top:14px;font-size:13px;color:var(--mute);max-height:120px;overflow:auto}
.log div{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.log b{color:var(--snow)}.log .six{color:var(--gold)}
/* ¡PREMIO! */
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.prize{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:21;pointer-events:none;opacity:0}
.prize.show{animation:prize 2.6s ease-out forwards}
.prize .gift{font-size:120px;animation:wobble .5s ease-in-out 4}
.prize h2{font:900 64px 'Playfair Display',serif;color:var(--gold);text-shadow:0 0 30px rgba(232,194,106,.9),0 4px 0 #8a6a24;letter-spacing:.04em}
.prize p{font:800 22px Inter;margin-top:6px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
@keyframes prize{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1.15)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.1)}75%{transform:rotate(14deg) scale(1.1)}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(232,194,106,.55),transparent 70%);z-index:19;pointer-events:none;opacity:0}
.flash.show{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff6,transparent),radial-gradient(2px 2px at 40% 70%,#fff5,transparent),radial-gradient(1px 1px at 85% 60%,#fff7,transparent),radial-gradient(1.5px 1.5px at 10% 85%,#fff5,transparent);background-size:320px 320px;animation:snow 30s linear infinite}
@keyframes snow{to{background-position:0 640px}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.snow{animation:none}}
</style>
</head>
<body>
<div class="snow"></div>
<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>
<div class="prize" id="prize"><div class="gift">🎁</div><h2 id="t_prize"></h2><p id="prizeWho"></p></div>

<div class="app">
  <div class="top"><a href="./" id="t_back"></a><select id="lang" aria-label="Idioma"></select></div>
  <h1 id="t_name"></h1>
  <p class="sub" id="t_rules"></p>

  <!-- jugadores (se pueden añadir también a mitad de partida) -->
  <div class="panel">
    <span class="lbl" id="t_players"></span>
    <div class="add"><input id="nameIn" maxlength="20" autocomplete="off"><button class="btn" id="addBtn">+</button></div>
    <div class="players" id="players"></div>
  </div>

  <div id="play" hidden>
    <div class="stage"><div class="scene"><div class="cube" id="cube"></div></div></div>
    <div class="turn" id="turn"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <button class="btn big" id="rollBtn"></button>
    <div class="log" id="log"></div>
  </div>

  <button class="btn big" id="startBtn"></button>
  <button class="btn ghost" id="resetBtn" style="margin-top:14px" hidden></button>
</div>

<script>
const L={
es:{name:'El Seis de la Suerte',rules:'Quien saca un 6 coge un regalo y vuelve a tirar. Con cualquier otro número, pasa el turno.',players:'Participantes',ph:'Nombre',start:'¡Empezar!',roll:'🎲 Tirar',turn:'Tira {n}',again:'¡Un 6! Tira otra vez, {n}',pass:'{n} saca un {v}. Le toca a {m}',prize:'¡PREMIO!',won:'{n} coge un regalo',reset:'Nueva partida',confirm:'¿Empezar una partida nueva? Los regalos vuelven a 0.',needTwo:'Hacen falta al menos 2 participantes',back:'← La Cuenta'},
en:{name:'Lucky Six',rules:'Roll a 6 and you take a present and roll again. Any other number passes the turn.',players:'Players',ph:'Name',start:'Let’s play!',roll:'🎲 Roll',turn:'{n} rolls',again:'A 6! Roll again, {n}',pass:'{n} rolled a {v}. {m}’s turn',prize:'PRIZE!',won:'{n} takes a present',reset:'New game',confirm:'Start a new game? Presents go back to 0.',needTwo:'You need at least 2 players',back:'← The Bill'},
de:{name:'Glückssechs',rules:'Wer eine 6 würfelt, nimmt sich ein Geschenk und würfelt noch einmal. Bei jeder anderen Zahl ist der Nächste dran.',players:'Mitspieler',ph:'Name',start:'Los geht’s!',roll:'🎲 Würfeln',turn:'{n} würfelt',again:'Eine 6! Nochmal, {n}',pass:'{n} würfelt eine {v}. {m} ist dran',prize:'GEWONNEN!',won:'{n} nimmt ein Geschenk',reset:'Neues Spiel',confirm:'Neues Spiel beginnen? Die Geschenke gehen auf 0.',needTwo:'Es braucht mindestens 2 Mitspieler',back:'← Die Rechnung'},
fr:{name:'Le Six Porte-Bonheur',rules:'Qui fait un 6 prend un cadeau et relance. Avec tout autre chiffre, on passe la main.',players:'Joueurs',ph:'Prénom',start:'C’est parti !',roll:'🎲 Lancer',turn:'{n} lance',again:'Un 6 ! Relance, {n}',pass:'{n} fait {v}. À {m}',prize:'GAGNÉ !',won:'{n} prend un cadeau',reset:'Nouvelle partie',confirm:'Commencer une nouvelle partie ? Les cadeaux repartent à 0.',needTwo:'Il faut au moins 2 joueurs',back:'← L’Addition'},
it:{name:'Il Sei Fortunato',rules:'Chi fa 6 prende un regalo e tira di nuovo. Con qualsiasi altro numero passa il turno.',players:'Giocatori',ph:'Nome',start:'Si gioca!',roll:'🎲 Tira',turn:'Tira {n}',again:'Un 6! Tira ancora, {n}',pass:'{n} fa {v}. Tocca a {m}',prize:'PREMIO!',won:'{n} prende un regalo',reset:'Nuova partita',confirm:'Iniziare una nuova partita? I regali tornano a 0.',needTwo:'Servono almeno 2 giocatori',back:'← Il Conto'},
pt:{name:'O Seis da Sorte',rules:'Quem tira um 6 fica com um presente e volta a lançar. Com qualquer outro número, passa a vez.',players:'Jogadores',ph:'Nome',start:'Vamos jogar!',roll:'🎲 Lançar',turn:'Lança {n}',again:'Um 6! Lança outra vez, {n}',pass:'{n} tirou {v}. É a vez de {m}',prize:'PRÉMIO!',won:'{n} fica com um presente',reset:'Novo jogo',confirm:'Começar um jogo novo? Os presentes voltam a 0.',needTwo:'São precisos pelo menos 2 jogadores',back:'← A Conta'},
nl:{name:'De Gelukszes',rules:'Gooi je een 6, dan pak je een cadeau en gooi je opnieuw. Bij elk ander getal is de volgende aan de beurt.',players:'Spelers',ph:'Naam',start:'Spelen!',roll:'🎲 Gooien',turn:'{n} gooit',again:'Een 6! Nog een keer, {n}',pass:'{n} gooit {v}. {m} is aan de beurt',prize:'PRIJS!',won:'{n} pakt een cadeau',reset:'Nieuw spel',confirm:'Een nieuw spel beginnen? De cadeaus gaan terug naar 0.',needTwo:'Er zijn minstens 2 spelers nodig',back:'← De Rekening'},
sv:{name:'Lyckosexan',rules:'Slår du en sexa tar du en present och slår igen. Med alla andra tal går turen vidare.',players:'Spelare',ph:'Namn',start:'Nu kör vi!',roll:'🎲 Slå',turn:'{n} slår',again:'En sexa! Slå igen, {n}',pass:'{n} slog {v}. {m}s tur',prize:'VINST!',won:'{n} tar en present',reset:'Nytt spel',confirm:'Börja ett nytt spel? Presenterna går tillbaka till 0.',needTwo:'Det behövs minst 2 spelare',back:'← Notan'},
no:{name:'Lykkeseksern',rules:'Får du en sekser, tar du en gave og kaster igjen. Med alle andre tall går turen videre.',players:'Deltakere',ph:'Navn',start:'Nå kjører vi!',roll:'🎲 Kast',turn:'{n} kaster',again:'En sekser! Kast igjen, {n}',pass:'{n} fikk {v}. {m} sin tur',prize:'PREMIE!',won:'{n} tar en gave',reset:'Nytt spill',confirm:'Starte et nytt spill? Gavene går tilbake til 0.',needTwo:'Det trengs minst 2 deltakere',back:'← Regningen'},
da:{name:'Lykkeseksen',rules:'Slår du en sekser, tager du en gave og slår igen. Med alle andre tal går turen videre.',players:'Deltagere',ph:'Navn',start:'Så kører vi!',roll:'🎲 Slå',turn:'{n} slår',again:'En sekser! Slå igen, {n}',pass:'{n} slog {v}. {m}s tur',prize:'PRÆMIE!',won:'{n} tager en gave',reset:'Nyt spil',confirm:'Start et nyt spil? Gaverne går tilbage til 0.',needTwo:'Der skal være mindst 2 deltagere',back:'← Regningen'},
fi:{name:'Onnenkutonen',rules:'Kuutosen heittänyt ottaa lahjan ja heittää uudelleen. Muulla luvulla vuoro vaihtuu.',players:'Pelaajat',ph:'Nimi',start:'Pelataan!',roll:'🎲 Heitä',turn:'{n} heittää',again:'Kuutonen! Heitä uudelleen, {n}',pass:'{n} heitti {v}. Vuorossa {m}',prize:'PALKINTO!',won:'{n} ottaa lahjan',reset:'Uusi peli',confirm:'Aloitetaanko uusi peli? Lahjat nollautuvat.',needTwo:'Tarvitaan vähintään 2 pelaajaa',back:'← Lasku'},
pl:{name:'Szczęśliwa Szóstka',rules:'Kto wyrzuci 6, bierze prezent i rzuca jeszcze raz. Przy każdej innej liczbie kolej przechodzi dalej.',players:'Gracze',ph:'Imię',start:'Gramy!',roll:'🎲 Rzuć',turn:'Rzuca {n}',again:'Szóstka! Rzucaj jeszcze raz, {n}',pass:'{n} wyrzuca {v}. Kolej: {m}',prize:'NAGRODA!',won:'{n} bierze prezent',reset:'Nowa gra',confirm:'Zacząć nową grę? Prezenty wracają do 0.',needTwo:'Potrzeba co najmniej 2 graczy',back:'← Rachunek'},
cs:{name:'Šťastná šestka',rules:'Kdo hodí šestku, vezme si dárek a hází znovu. Při jakémkoli jiném čísle jde tah dál.',players:'Hráči',ph:'Jméno',start:'Hrajeme!',roll:'🎲 Hodit',turn:'Hází {n}',again:'Šestka! Házej znovu, {n}',pass:'{n} hodil(a) {v}. Na řadě je {m}',prize:'VÝHRA!',won:'{n} si bere dárek',reset:'Nová hra',confirm:'Začít novou hru? Dárky se vynulují.',needTwo:'Jsou potřeba alespoň 2 hráči',back:'← Účet'},
ro:{name:'Șase cu Noroc',rules:'Cine dă 6 ia un cadou și aruncă din nou. Cu orice alt număr, trece rândul.',players:'Jucători',ph:'Nume',start:'Să jucăm!',roll:'🎲 Aruncă',turn:'Aruncă {n}',again:'Un 6! Mai aruncă, {n}',pass:'{n} a dat {v}. Urmează {m}',prize:'PREMIU!',won:'{n} ia un cadou',reset:'Joc nou',confirm:'Începeți un joc nou? Cadourile revin la 0.',needTwo:'Este nevoie de cel puțin 2 jucători',back:'← Nota'}
};
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem('seis_'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('seis_'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='es'; const T=k=>(L[lang]||L.en)[k];
// partida: jugadores con sus regalos, a quién le toca, historial. Se guarda sola.
let G=store.get('game')||null;
if(!G){ let names=[]; try{names=JSON.parse(localStorage.getItem('lacuenta_names'))||[]}catch(e){}
  G={players:names.map(n=>({n,g:0})),turn:0,started:false,log:[]}; }
function save(){store.set('game',G);}

function pickLang(){
  const q=new URLSearchParams(location.search).get('lang'); let saved=null; try{saved=JSON.parse(localStorage.getItem('lacuenta_lang'))}catch(e){}
  for(const c of [q,saved,...(navigator.languages||[navigator.language])]){ if(!c) continue; let k=c.slice(0,2).toLowerCase(); if(k==='nb'||k==='nn')k='no'; if(L[k]) return k; }
  return 'es';
}
for(const k in L){const o=document.createElement('option');o.value=k;o.textContent=k.toUpperCase();$('lang').appendChild(o);}
$('lang').onchange=()=>{lang=$('lang').value;try{localStorage.setItem('lacuenta_lang',JSON.stringify(lang))}catch(e){}render();};

// dado 3D
const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
const ROT={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
$('cube').innerHTML=[1,2,3,4,5,6].map(v=>`<div class="f f${v}">${PIPS[v].map(p=>`<i style="grid-area:${Math.ceil(p/3)}/${(p-1)%3+1}"></i>`).join('')}</div>`).join('');
let rx=-20,ry=25;

function render(){
  document.documentElement.lang=lang; $('lang').value=lang;
  document.title=T('name')+' · Stela Mare';
  $('t_name').textContent='🎁 '+T('name'); $('t_rules').textContent=T('rules'); $('t_players').textContent=T('players');
  $('nameIn').placeholder=T('ph'); $('startBtn').textContent=T('start'); $('rollBtn').textContent=T('roll');
  $('resetBtn').textContent='↺ '+T('reset'); $('t_prize').textContent=T('prize'); $('t_back').textContent=T('back');
  const cur=G.players[G.turn];
  $('players').innerHTML=G.players.map((p,i)=>`<div class="pl ${G.started&&i===G.turn?'now':''}"><span class="nm">${esc(p.n)}</span><span class="gifts">${p.g?'🎁 '+p.g:''}</span>${G.started?'':`<button class="x" data-rm="${i}" aria-label="x">×</button>`}</div>`).join('');
  $('players').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{G.players.splice(+b.dataset.rm,1);save();render();});
  $('play').hidden=!G.started; $('startBtn').hidden=G.started; $('resetBtn').hidden=!G.started;
  if(G.started&&cur&&!rolling) $('turn').textContent=T('turn').replace('{n}',cur.n);
  $('log').innerHTML=G.log.slice().reverse().slice(0,30).map(x=>`<div class="${x.v===6?'six':''}"><b>${esc(x.n)}</b> → ${x.v===6?'🎁 6':x.v}</div>`).join('');
}
function addName(){ const v=$('nameIn').value.trim(); if(!v) return; G.players.push({n:v,g:0}); $('nameIn').value=''; save(); render(); $('nameIn').focus(); }
$('addBtn').onclick=addName; $('nameIn').onkeydown=e=>{if(e.key==='Enter')addName();};
$('startBtn').onclick=()=>{ if(G.players.length<2){$('msg').textContent='';alert(T('needTwo'));return;} G.started=true;G.turn=0;save();render(); };
$('resetBtn').onclick=()=>{ if(!confirm(T('confirm'))) return; G.players.forEach(p=>p.g=0); G.turn=0; G.log=[]; G.started=false; save(); $('msg').textContent=''; render(); };

let rolling=false;
$('rollBtn').onclick=()=>{
  if(rolling||!G.players.length) return; rolling=true; $('rollBtn').disabled=true; $('msg').textContent='';
  const v=1+Math.floor(Math.random()*6), [fx,fy]=ROT[v], turns=2+Math.floor(Math.random()*2);
  rx=Math.ceil(rx/360)*360+360*turns+fx; ry=Math.ceil(ry/360)*360+360*turns+fy;
  const c=$('cube'); c.classList.remove('bounce'); void c.offsetWidth; c.classList.add('bounce'); c.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
  setTimeout(()=>{
    const p=G.players[G.turn]; G.log.push({n:p.n,v});
    if(v===6){ p.g++; celebrate(p.n); $('turn').textContent=T('again').replace('{n}',p.n); }
    else { const next=(G.turn+1)%G.players.length; $('msg').textContent=T('pass').replace('{n}',p.n).replace('{v}',v).replace('{m}',G.players[next].n); G.turn=next; }
    save(); rolling=false; $('rollBtn').disabled=false; render();
    if(v===6) $('turn').textContent=T('again').replace('{n}',p.n);
  },1650);
};

// ---------- ¡PREMIO! confeti, purpurina y regalos ----------
const cv=$('fx'), cx=cv.getContext('2d'); let parts=[], anim=null;
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;}
addEventListener('resize',resize); resize();
function celebrate(name){
  $('prizeWho').textContent=T('won').replace('{n}',name);
  const pr=$('prize'); pr.classList.remove('show'); void pr.offsetWidth; pr.classList.add('show');
  const fl=$('flash'); fl.classList.remove('show'); void fl.offsetWidth; fl.classList.add('show');
  if(navigator.vibrate) navigator.vibrate([120,60,120,60,260]);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const W=cv.width,H=cv.height,d=devicePixelRatio, cols=['#e8c26a','#fff3c4','#d63a3a','#1f8a4c','#ffffff','#f5d98b'];
  for(let k=0;k<3;k++){ const ox=W*(0.2+0.3*k), oy=H*0.55;           // tres estallidos
    for(let i=0;i<70;i++){ const a=Math.random()*Math.PI*2, s=(4+Math.random()*9)*d;
      parts.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-8*d,r:(3+Math.random()*5)*d,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1,shape:Math.random()<.35?'glit':'rect'}); } }
  for(let i=0;i<14;i++) parts.push({x:Math.random()*W,y:-40*d,vx:(Math.random()-.5)*2*d,vy:(2+Math.random()*3)*d,r:26*d,emoji:['🎁','✨','⭐','🎉'][i%4],rot:0,vr:(Math.random()-.5)*.1,life:1});
  if(!anim) anim=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height); const d=devicePixelRatio;
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=(p.emoji?0.12:0.28)*d; p.vx*=0.99; p.rot+=p.vr; p.life-=p.emoji?0.004:0.008;
    cx.save(); cx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5)); cx.translate(p.x,p.y); cx.rotate(p.rot);
    if(p.emoji){cx.font=p.r+'px serif';cx.textAlign='center';cx.fillText(p.emoji,0,0);}
    else if(p.shape==='glit'){ const tw=0.5+0.5*Math.sin(p.rot*8); cx.fillStyle=p.c; cx.beginPath(); for(let j=0;j<4;j++){const a=j*Math.PI/2; cx.lineTo(Math.cos(a)*p.r*1.6*tw,Math.sin(a)*p.r*1.6*tw); cx.lineTo(Math.cos(a+Math.PI/4)*p.r*.4,Math.sin(a+Math.PI/4)*p.r*.4);} cx.fill(); }
    else { cx.fillStyle=p.c; cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); }
    cx.restore(); });
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+60*d);
  anim=parts.length?requestAnimationFrame(tick):null;
  if(!anim) cx.clearRect(0,0,cv.width,cv.height);
}

lang=pickLang(); render();
</script>
